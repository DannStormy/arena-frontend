# Render Blueprint — Arena frontend (Vite SPA, static site).
# In Render: New → Blueprint → connect this repo (branch below), or create a
# Static Site manually with the same build command + publish path.
#
# The API URL is baked in at build time from .env.production (edit it there if
# your API lands on a different URL). Static sites are free and always warm.
services:
  - type: web
    name: arena-frontend
    runtime: static
    branch: wire-backend-data
    buildCommand: yarn install --frozen-lockfile && yarn build
    staticPublishPath: ./dist
    # SPA fallback — every route serves index.html so client-side routing works.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
